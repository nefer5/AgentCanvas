name: Validate and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z tag to validate and package as a draft release (blank: validate main)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          # Hosted Windows runners may expose RUNNER~1 through TEMP/TMP.
          # Fixtures must use the same canonical spelling as filesystem validation.
          $testTemp = node -p "require('node:fs').realpathSync.native(require('node:os').tmpdir())"
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the temporary directory' }
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run check:publish
      - run: npm test
      - run: npm run build
      - name: Obtain verified portable compiler
        shell: powershell
        run: ./scripts/bootstrap-inno.ps1
      - run: npm run release:package
      - run: npm run export:source
      - uses: actions/upload-artifact@v4
        with:
          name: AgentCanvas-windows
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: AgentCanvas-windows
          path: release
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag/package version mismatch' }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe','.zip','.txt') } | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title "AgentCanvas $version" @assets
